<main class="wrap">
 <header class="heading">

  <aside class="preview-aside"><div class="detail-field"><label class="label" for="viewerCategory">證件類型</label><select class="detail-select" id="viewerCategory"></select><span id="viewerStatus" class="status"></span></div><div class="detail-field"><span class="label">來源</span><span class="value" id="viewerSource"></span></div><div class="detail-field date-field"><span class="label">上傳日期</span><span class="value" id="viewerDate"></span></div><div class="detail-field" id="judgeField" hidden><span class="label">AI 判讀（待確認）</span><span class="value" id="viewerJudge" style="white-space:normal;line-height:1.6"></span></div><details class="error-detail" id="errorDetails" hidden><summary>判讀失敗詳情</summary><div id="errorText"></div></details><div class="aside-bottom"><a class="action" id="downloadOne" style="text-decoration:none;margin-bottom:8px" download><span>⬇ 下載這張</span></a><button type="button" class="action" id="openOriginal"><svg class="icon"><use href="#i-external"/></svg><span>開啟原始附件</span></button><button type="button" class="action" id="deleteOne" style="margin-top:8px;color:#b91c1c;border-color:#f3c4c4"><span>🗑 刪除這張</span></button><button type="button" class="action ai" id="retryOne" style="margin-top:8px"><svg class="icon"><use href="#i-refresh"/></svg><span>重新判讀</span></button><p class="aside-note" id="viewerNote">原始附件未提供；目前只展示截圖中的縮圖。</p></div></aside>

<script>
'use strict';
/**
 * Standalone UI, no external libraries, no automatic uploads.
 * The demo contains only the 12 thumbnails visible in the user's screenshot;
 * total=15 is the source total, not a claim that unseen files were supplied.
 * To integrate, call DocumentGallery.setActions(...) then .setData(...).
 * Classification state is held in memory only. An optional saveCategory callback
 * may persist manual changes after server-side authorization.
 */
const initialDocuments=[];
(() => {
 const $=(id)=>document.getElementById(id);
 const svg=(name)=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
 const escape=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const categories=__CATS__;
 const groups=[['all','全部'],['identity','身分證明'],['finance','財力資料'],['vehicle','車輛／手機'],['other','其他']];
 const categoryGroup=__GROUPS__;
 const actions={};
 const state={customerId:'',total:0,documents:initialDocuments.map(d=>({...d})),group:'all',pendingOnly:false,source:'all',sort:'original',query:'',selected:new Set(),view:'grid',currentId:null,zoom:1,demo:false,classificationWrites:new Set()};
 let toastTimer;
 const docById=(id)=>state.documents.find(d=>d.id===id);
 const isIssue=(d)=>d.kind==='error'||!!d.error;
 const sourceLabel=(source)=>source==='chat'?'LINE 聊天':source==='form'?'線上申請書':source==='admin'?'行政上傳':source;
 const safeUrl=(value)=>{ if(!value)return ''; try{if(/^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(value))return value;const u=new URL(value,location.href);if(['https:','http:','blob:'].includes(u.protocol))return u.href;}catch{}return ''; };
 const notify=(message)=>{$('toastText').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3300);};
 function showConnection(name,key,message){
  $('connectionTitle').textContent=name+' · 尚未連接';
  $('connectionText').textContent=message||'這份 HTML 是介面預覽。此功能需接回原系統，不會直接修改或下載真實客戶資料。';
  $('connectionHint').textContent='串接點：DocumentGallery.setActions({ '+key+': … })';
  if(!$('connection').open)$('connection').showModal();
 }
 function options(current,placeholder=false){return (placeholder?'<option value="" selected disabled>改分類</option>':'')+categories.map(c=>`<option value="${escape(c)}" ${!placeholder&&c===current?'selected':''}>${escape(c)}</option>`).join('');}
 function filtered(){
  const q=state.query.trim().toLowerCase();
  return state.documents.filter(d=>(state.group==='all'||categoryGroup[d.category]===state.group)&&(!state.pendingOnly||isIssue(d)||d.unclassified)&&(state.source==='all'||d.source===state.source)&&(!q||`${d.category} ${sourceLabel(d.source)} ${d.date}`.toLowerCase().includes(q))).sort((a,b)=>{
   if(state.sort==='newest')return b.date.localeCompare(a.date)||a.order-b.order;
   if(state.sort==='oldest')return a.date.localeCompare(b.date)||a.order-b.order;
   if(state.sort==='issue')return Number(isIssue(b)||!!b.unclassified)-Number(isIssue(a)||!!a.unclassified)||a.order-b.order;
   return a.order-b.order;
  });
 }
 function mediaContent(d){
  if(d.kind==='error')return `<div class="error-figure">${svg('image-off')}<span>無法預覽</span></div>`;
  if(d.kind==='file'||!safeUrl(d.previewUrl))return `<div class="file-figure"><div class="file-illustration"></div><span class="file-caption">開啟附件 ${svg('external')}</span></div>`;
  return `<img src="${escape(safeUrl(d.previewUrl))}" alt="${escape(d.category)}${state.demo?'截圖縮圖':''}" loading="lazy" decoding="async" draggable="false"><span class="open-hint">${svg('eye')}</span>`;
 }
 function statusMarkup(d){
  if(d.isManual)return `${svg('edit')}手動分類`;
  if(isIssue(d))return `${svg('warning')}判讀失敗`;
  if(d.unclassified)return `${svg('warning')}未判讀`;
  return `${svg('sparkle')}AI 分類`;
 }
 function renderTabs(){
  $('categoryTabs').innerHTML=groups.map(([id,label])=>{const n=state.documents.filter(d=>id==='all'||categoryGroup[d.category]===id).length;return `<button class="tab ${state.group===id?'active':''}" data-group="${id}" type="button" aria-pressed="${state.group===id}">${label}<span class="tab-count">${n}</span></button>`;}).join('');
 }
 function updateSelection(){
  const visible=filtered(), picked=visible.filter(d=>state.selected.has(d.id)).length;
  $('selectAll').checked=visible.length>0&&picked===visible.length;
  $('selectAll').indeterminate=picked>0&&picked<visible.length;
  $('selectAll').disabled=!visible.length;
  $('selectionCount').textContent=state.selected.size?`已選 ${state.selected.size} 份`:`${visible.length} 份`;
  $('clearSelection').hidden=!state.selected.size;
  $('downloadLabel').textContent=state.selected.size?`下載已選照片（${state.selected.size}）`:'下載全部照片';
 }
 function render(){
  $('customerId').textContent=state.customerId;
  $('totalCount').textContent=`共 ${state.total} 份附件`;
  $('loadedCount').textContent=`已載入 ${state.documents.length} 份`;
  $('previewPill').hidden=!state.demo;
  $('previewNote').hidden=!state.demo;
  renderTabs();
  const docs=filtered();
  $('gallery').className='grid'+(state.view==='list'?' list-view':'');
  $('gallery').innerHTML=docs.map(d=>`<article class="card ${state.selected.has(d.id)?'selected':''} ${d.kind==='error'?'error-card':''}" data-id="${escape(d.id)}">
    <label class="card-check"><input type="checkbox" data-select="${escape(d.id)}" aria-label="選取${escape(d.category)}" ${state.selected.has(d.id)?'checked':''}></label>
    <button class="media ${d.kind==='error'?'error-media':d.kind==='file'?'file-media':''}" data-open="${escape(d.id)}" type="button" aria-label="預覽${escape(d.category)}">${mediaContent(d)}</button>
    <span class="card-number">${String(d.order).padStart(2,'0')}</span>
    <div class="body"><h2 class="card-title">${escape(d.category)}</h2><div class="meta" title="${escape(sourceLabel(d.source))} · ${escape(d.date)}">${svg(d.source==='chat'?'chat':'doc')}<span>${escape(sourceLabel(d.source))}</span><span class="dot">·</span><time datetime="${escape(d.date)}">${escape(d.date.slice(5).replace('-','/'))}</time></div>${d.judge?`<div class="judge ${/⚠️|沒有時間/.test(d.judge)?'bad':''}">${escape(d.judge)}</div>`:''}<div class="card-bottom">${isIssue(d)?`<button type="button" class="status ${d.isManual?'manual':'failed'}" data-open="${escape(d.id)}">${statusMarkup(d)}</button>`:`<span class="status ${d.isManual?'manual':''}">${statusMarkup(d)}</span>`}<label class="change">改分類 ${svg('chevron')}<select data-category="${escape(d.id)}" aria-label="${escape(d.category)}變更分類" ${state.classificationWrites.has(d.id)?'disabled':''}>${options(d.category,true)}</select></label></div></div>
   </article>`).join('');
  $('emptyState').hidden=!!docs.length;$('gallery').hidden=!docs.length;
  $('pendingText').textContent=`待處理 ${state.documents.filter(d=>isIssue(d)||d.unclassified).length}`;
  $('pendingToggle').classList.toggle('active',state.pendingOnly);
  $('pendingToggle').setAttribute('aria-pressed',String(state.pendingOnly));
  $('gridView').classList.toggle('active',state.view==='grid');$('listView').classList.toggle('active',state.view==='list');
  $('gridView').setAttribute('aria-pressed',String(state.view==='grid'));$('listView').setAttribute('aria-pressed',String(state.view==='list'));
  updateSelection();
 }
 async function changeCategory(id,category){
  if(!categories.includes(category))return;
  const d=docById(id);if(!d||state.classificationWrites.has(id))return;
  const before={category:d.category,isManual:d.isManual};const editingCustomer=state.customerId;
  d.category=category;d.isManual=true;state.classificationWrites.add(id);render();
  if(state.currentId===id&&$('viewer').open)renderViewer();
  try{
   if(typeof actions.saveCategory==='function')await actions.saveCategory({customerId:state.customerId,id,category,isManual:true});
   document.dispatchEvent(new CustomEvent('document-gallery:category-change',{detail:{customerId:state.customerId,id,category,isManual:true}}));
   if(state.customerId===editingCustomer)notify(actions.saveCategory?'分類已儲存，AI 不覆蓋手動分類':'已調整分類（本頁預覽；重新整理即還原）');
  }catch(error){if(state.customerId===editingCustomer){const active=docById(id);if(active)Object.assign(active,before);notify('分類儲存失敗，已保留原分類');}console.error('saveCategory failed',error);}
  finally{state.classificationWrites.delete(id);render();if(state.currentId===id&&$('viewer').open)renderViewer();}
 }
 // Validate adapter data; do not execute arbitrary markup or URLs.
 function normalize(d,i){
  if(!d||typeof d.id!=='string'||!d.id)throw new TypeError('documents 每筆需要非空 id');
  return {judge:String(d.judge||''),unclassified:!!d.unclassified,pages:Number(d.pages)||0,viewUrl:safeUrl(d.viewUrl||''),id:d.id,category:categories.includes(d.category)?d.category:'其他',source:String(d.source||'chat'),date:String(d.date||''),kind:['image','file','error'].includes(d.kind)?d.kind:'file',previewUrl:safeUrl(d.previewUrl||''),fileUrl:safeUrl(d.fileUrl||''),isManual:!!d.isManual,order:Number.isFinite(d.order)?d.order:i+1,error:String(d.error||'')};

 // Preserve manual classification on refresh or AI updates. Server must enforce

 function setData(payload){
  if(!payload||!Array.isArray(payload.documents))throw new TypeError('需要 documents 陣列');

  const existing=new Map(state.documents.map(d=>[d.id,d]));

 function mergeResults(result){
  if(result==null)return;
  const changes=Array.isArray(result)?result:result.documents;
  if(!Array.isArray(changes))return;
  const changed=new Map(changes.filter(d=>d&&typeof d.id==='string').map(d=>[d.id,d]));
  const docs=state.documents.map(d=>{const incoming=changed.get(d.id);if(!incoming)return d;changed.delete(d.id);return {...d,...incoming,...(d.isManual?{category:d.category,isManual:true}:{})};});
  for(const d of changed.values())docs.push(d);
  setData({customerId:state.customerId,total:result.total??state.total,documents:docs,demo:state.demo});

 async function runAction(key,id=null){
  const fn=actions[key];

  if(typeof fn!=='function'){
   showConnection(titles[key]||'此功能',key,key.startsWith('download')?'目前只有截圖中的縮圖，沒有原始證件。接回原系統後才能下載完整 PDF 或照片，不會把截圖冒充原始附件。':null);return;
  }
  const trigger=$(key==='classifyOne'?'retryOne':key==='openFile'?'openOriginal':key);
  if(trigger?.disabled)return;
  if(trigger)trigger.disabled=true;
  const customerAtStart=state.customerId;
  try{
   const ids=id?[id]:(key==='classifyAll'?state.documents.filter(d=>!d.isManual).map(d=>d.id):(state.selected.size?[...state.selected]:state.documents.map(d=>d.id)));
   if(key==='classifyAll'&&!ids.length){notify('所有附件皆為手動分類，未送出重新判讀');return;}
   const result=await fn({customerId:customerAtStart,ids,total:state.total,loadedIds:state.documents.map(d=>d.id),scope:id?'one':key==='classifyAll'?'nonManual':state.selected.size?'selected':'all',preserveManual:true});

   if(state.customerId!==customerAtStart)return;

    if(key==='refetch'&&result?.replace===true&&Array.isArray(result.documents))setData({customerId:customerAtStart,total:result.total,documents:result.documents,demo:state.demo});else mergeResults(result);
